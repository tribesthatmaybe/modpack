---
title: "Akashic Tome"
category: "Equipment"
text: |
  You are going to end up with a lot of books on your adventure, and many of them you will want to keep. You can add a book to the tome by crafting it with the tome. Right click with the tome to select a book, and view the selected book. Deselect a book by shift-clicking when you are not pointing at any blocks in world. You can remove the selected book from the tome by dropping (default "q") while crouching (default "shift").
