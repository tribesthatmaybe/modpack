---
title: "Light"
category: "HOWTO"
text: |
  Many, but not all, dimensions have a day / night cycle. And when you travel underground, it will also get dark. When it is dark, monsters come out to play. There are a variety of ways to keep areas illumiated from the humble torch to electric floodlights. Early in the game, while you are still lacking in the right resources, you may wish to conserve your torches. Note that the most easily craftable torches are unlit, and will extinguish themselves after some time.

  Unlit torches may be lit by crafting them with a matchbook, or by using a flint and steel on them. When you pick them up, or if they are rained upon, they will be extinguished. They will also burn and be used up after some time.

  Carrying a torch (or any light emitting item) will also generate some light around you.
